; PlatformIO Configuration — Disaster Sentinel Node FIR3 (Fire)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    sandeepmistry/LoRa@^0.8.0
    adafruit/Adafruit BME280 Library@^2.2.2
    adafruit/Adafruit Unified Sensor@^1.1.9

build_flags =
    -DNODE_ID=\"FIR3\"
    -DNODE_TYPE=0x02
    -DLORA_FREQUENCY=433E6
    -DLORA_TX_POWER=17
    -DLORA_SPREADING_FACTOR=7
    -DLORA_BANDWIDTH=125E3
