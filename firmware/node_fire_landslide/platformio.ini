; PlatformIO Configuration — Disaster Sentinel Node 2 (Fire + Landslide)
; ESP32 DevKit V1 + SX1278 LoRa + Flame + MQ-2 + MPU6050 + Soil Moisture + BME280

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    sandeepmistry/LoRa@^0.8.0
    adafruit/Adafruit BME280 Library@^2.2.2
    adafruit/Adafruit Unified Sensor@^1.1.9
    adafruit/Adafruit MPU6050@^2.2.4

build_flags =
    -DNODE_ID=\"FIR2\"
    -DNODE_TYPE=0x02
    -DLORA_FREQUENCY=433E6
    -DLORA_TX_POWER=17
    -DLORA_SPREADING_FACTOR=7
    -DLORA_BANDWIDTH=125E3
    -DNORMAL_INTERVAL_MS=120000
    -DALERT_INTERVAL_MS=15000
    -DBASELINE_DURATION_HOURS=48
