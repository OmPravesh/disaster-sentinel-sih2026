; PlatformIO Configuration — Disaster Sentinel Node SLD2 (Landslide)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    sandeepmistry/LoRa@^0.8.0
    adafruit/Adafruit BME280 Library@^2.2.2
    adafruit/Adafruit Unified Sensor@^1.1.9
    adafruit/Adafruit MPU6050@^2.2.4

build_flags =
    -DNODE_ID=\"SLD2\"
    -DNODE_TYPE=0x03
    -DLORA_FREQUENCY=433E6
    -DLORA_TX_POWER=17
    -DLORA_SPREADING_FACTOR=7
    -DLORA_BANDWIDTH=125E3
