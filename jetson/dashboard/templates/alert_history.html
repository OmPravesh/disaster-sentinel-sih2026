<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/index.css">
    <style>
        .alert-history-page { padding: 24px; max-width: 1200px; margin: 0 auto; }
        .alert-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        .alert-table th, .alert-table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border-glass); font-size: 0.78rem; }
        .alert-table th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 0.68rem; }
        .alert-table tr:hover { background: var(--bg-glass); }
        .back-link { color: var(--accent-cyan); text-decoration: none; font-size: 0.85rem; }
        .back-link:hover { text-decoration: underline; }
        .risk-cell { font-weight: 700; font-family: var(--font-mono); }
        .risk-cell.RED { color: var(--risk-red); }
        .risk-cell.ORANGE { color: var(--risk-orange); }
        .risk-cell.YELLOW { color: var(--risk-yellow); }
        .risk-cell.GREEN { color: var(--risk-green); }
    </style>
</head>
<body>
    <header id="top-bar">
        <div class="top-bar-left">
            <div class="logo-container">
                <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/></svg></div>
                <div><h1>DISASTER SENTINEL</h1><p class="subtitle">Alert History</p></div>
            </div>
        </div>
        <div class="top-bar-right">
            <a href="/" class="back-link">← Back to Dashboard</a>
        </div>
    </header>

    <div class="alert-history-page">
        <h2 style="font-size: 1rem; color: var(--text-secondary); margin-bottom: 8px;">Alert History</h2>
        <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 16px;">Complete log of all generated alerts with timestamps and actions taken.</p>

        <table class="alert-table" id="alert-table">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Node</th>
                    <th>Hazard</th>
                    <th>Risk Level</th>
                    <th>Probability</th>
                    <th>Severity</th>
                    <th>Confirmation</th>
                    <th>Layers</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="alert-tbody">
                <tr><td colspan="9" style="text-align:center; color: var(--text-muted);">Loading alerts...</td></tr>
            </tbody>
        </table>
    </div>

    <footer>
        <span>Disaster Sentinel v1.0 — SIH 2026</span>
        <span id="clock"></span>
    </footer>

    <script>
        // Fetch and display alerts
        async function loadAlerts() {
            try {
                const res = await fetch('/api/alerts?limit=100');
                const data = await res.json();
                const tbody = document.getElementById('alert-tbody');
                
                if (!data.alerts || data.alerts.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; color: var(--text-muted);">No alerts recorded yet</td></tr>';
                    return;
                }

                tbody.innerHTML = data.alerts.map(a => `
                    <tr>
                        <td style="font-family: var(--font-mono); font-size: 0.7rem;">${new Date(a.timestamp).toLocaleString()}</td>
                        <td>${a.node_id}</td>
                        <td>${a.hazard_name}</td>
                        <td class="risk-cell ${a.risk_level}">${a.risk_level}</td>
                        <td>${(a.probability * 100).toFixed(1)}%</td>
                        <td>${a.severity}</td>
                        <td>${a.confirmation_level}</td>
                        <td>${a.layers_anomalous}/3</td>
                        <td style="font-size: 0.68rem;">${a.actions_taken || '—'}</td>
                    </tr>
                `).join('');
            } catch (e) {
                document.getElementById('alert-tbody').innerHTML = 
                    '<tr><td colspan="9" style="text-align:center; color: var(--text-muted);">Unable to load alerts</td></tr>';
            }
        }

        // Clock
        setInterval(() => {
            const el = document.getElementById('clock');
            if (el) el.textContent = new Date().toLocaleTimeString('en-IN', { hour12: false });
        }, 1000);

        loadAlerts();
        setInterval(loadAlerts, 10000); // Refresh every 10s
    </script>
</body>
</html>
