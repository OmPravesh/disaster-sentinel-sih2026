# Disaster Sentinel — Jetson Configuration
# All system parameters in one place

system:
  name: "Disaster Sentinel"
  version: "2.0.0"
  log_level: "INFO"

# LoRa Receiver Configuration
lora:
  spi_bus: 0
  spi_device: 0
  frequency: 433000000   # 433 MHz
  spreading_factor: 7
  bandwidth: 125000       # 125 kHz
  coding_rate: 5          # 4/5
  sync_word: 0xF3
  # Jetson Orin Nano GPIO pin numbers (Linux GPIO numbering)
  reset_pin: 25           # Pin 22 on 40-pin header
  dio0_pin: 4             # Pin 7 on 40-pin header (IRQ)

# Node Registry — 4 Dedicated ESP32 Nodes
nodes:
  FLD1:
    name: "Flood Monitoring Node"
    hazard_type: "FLOOD"
    layer_count: 3
    location:
      lat: 28.6139
      lon: 77.2090
      description: "River bank monitoring point Alpha"
    sensors:
      layer1: "Water Level (Ultrasonic JSN-SR04T)"
      layer2: "Rain Sensor (YL-83)"
      layer3: "BME280 (Pressure/Humidity)"
    weights:
      l1: 0.50
      l2: 0.30
      l3: 0.20

  SLD2:
    name: "Landslide Monitoring Node"
    hazard_type: "LANDSLIDE"
    layer_count: 3
    location:
      lat: 28.6150
      lon: 77.2100
      description: "Hill slope monitoring point Beta"
    sensors:
      layer1: "MPU6050 (Tilt/Vibration)"
      layer2: "Soil Moisture (Capacitive v1.2)"
      layer3: "BME280 (Pressure/Humidity)"
    weights:
      l1: 0.50
      l2: 0.30
      l3: 0.20

  FIR3:
    name: "Fire Monitoring Node"
    hazard_type: "FIRE"
    layer_count: 3
    location:
      lat: 28.6160
      lon: 77.2110
      description: "Forest edge monitoring point Gamma"
    sensors:
      layer1: "Flame/IR Sensor (KY-026)"
      layer2: "MQ-2 Gas/Smoke Sensor"
      layer3: "BME280 (Temperature/Humidity)"
    weights:
      l1: 0.50
      l2: 0.30
      l3: 0.20

  POL4:
    name: "Pollution Monitoring Node"
    hazard_type: "POLLUTION"
    layer_count: 2          # 2-Layer only — no BME280
    location:
      lat: 28.6170
      lon: 77.2120
      description: "Industrial zone monitoring point Delta"
    sensors:
      layer1: "MQ-135 (Air Quality Index / Gas)"
      layer2: "PM2.5 Dust Sensor (PMS5003)"
      layer3: "Not used"
    weights:
      l1: 0.55
      l2: 0.45
      l3: 0.00              # No L3 for 2-layer node

# Three-Layer Validation Thresholds
three_layer:
  # 3-Layer nodes (FLD1, SLD2, FIR3)
  three_layer_thresholds:
    high_min_layers: 3
    high_min_combined: 0.75
    medium_min_layers: 2
    medium_min_combined: 0.60
    low_min_layers: 1
    low_min_combined: 0.40

  # 2-Layer nodes (POL4)
  two_layer_thresholds:
    high_min_layers: 2
    high_min_combined: 0.75
    medium_min_layers: 1
    medium_min_combined: 0.55
    low_min_layers: 1
    low_min_combined: 0.35

# Risk Level Thresholds
risk_levels:
  green:
    max_score: 0.40
    actions: ["dashboard_normal"]
  yellow:
    max_score: 0.60
    actions: ["dashboard_warning"]
  orange:
    max_score: 0.75
    min_sustained_minutes: 5
    actions: ["dashboard_alert", "buzzer_short"]
  red:
    min_score: 0.75
    min_sustained_minutes: 3
    actions: ["dashboard_critical", "sms", "buzzer_continuous", "strobe"]

# AI Prediction Engine
ai:
  model_dir: "data/models"         # Directory for trained GRU model weights
  sequence_length: 30              # Number of past readings for prediction
  prediction_horizons: [15, 30, 60]  # Minutes into the future
  auto_train:
    enabled: true                  # Auto-train if model missing at startup
    epochs: 100
    learning_rate: 0.001
    synthetic_sequences: 2000      # Number of training sequences to generate

# Alert Configuration
alerts:
  sms:
    enabled: true
    uart_port: "/dev/ttyTHS1"     # Jetson UART1
    baud_rate: 9600
    recipients:
      - "+919876543210"           # Primary contact
      - "+919876543211"           # Secondary contact
    cooldown_minutes: 5            # Min time between SMS for same hazard

  buzzer:
    enabled: true
    gpio_pin: 12                   # Pin 12 on 40-pin header
    short_beep_ms: 500
    continuous_interval_ms: 1000

  strobe:
    enabled: true
    gpio_pin: 16                   # Pin 16 on 40-pin header

# Database
database:
  path: "data/disaster_sentinel.db"
  max_readings_per_node: 100000    # Rotate old data
  retention_days: 30

# Dashboard (FastAPI Embedded SPA)
dashboard:
  host: "0.0.0.0"
  port: 8080
  title: "Disaster Sentinel"
  refresh_interval_ms: 1000

# Web Command Center Dashboard (Flask Multi-Page Application)
web_dashboard:
  host: "0.0.0.0"
  port: 5000
  title: "Disaster Sentinel — Central Command Center"
  debug: true
